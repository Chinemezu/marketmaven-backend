name: FRED Economic Indicators Puller

on:
  schedule:
    # Weekly, not daily -- the underlying series (CPI, unemployment, Fed
    # funds: monthly; GDP: quarterly) don't change often enough to justify
    # more frequent polling, and a daily schedule would misleadingly imply
    # a live feed this isn't.
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run FRED puller
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python ingestion/fred_puller.py
